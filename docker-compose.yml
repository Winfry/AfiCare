version: "3.9"

# ── AfiCare MediLink — Local development stack ────────────────
# Services:
#   flutter-web  — Flutter web app served by Nginx (port 8080)
#
# The old Python/Streamlit AI agent (aficare-agent/) is legacy and no
# longer part of this stack — its hosted backend is disabled and the
# Flutter app's MedicalAIService runs fully offline/local-only. See
# aficare-agent/README.md for details. That directory is kept for
# reference only; it is not built or run here.
#
# Usage:
#   docker compose up --build          # start the app
#   docker compose down                # stop it
#
# Environment:
#   Copy .env.example to .env and fill in your Supabase credentials.
# ──────────────────────────────────────────────────────────────

services:

  # ── Flutter Web ──────────────────────────────────────────────
  flutter-web:
    build:
      context: ./aficare_flutter
      dockerfile: Dockerfile
    container_name: aficare-flutter-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.aficare.service=flutter-web"

networks:
  default:
    name: aficare-network
